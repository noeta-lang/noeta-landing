name: Build and deploy

# Push to main → build the site (including the Playwright-rendered OG image)
# and deploy the static assets to Cloudflare Workers.
#
# The design system is a sibling-checkout file: dependency
# ("@noeta/theme": "file:../noeta-theme"), so the site is checked out into
# site/ with the theme cloned next to it — the same shape as local disk.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # A Noeta release dispatches `release-published` with `{ tag }` to refresh the version pill.
  repository_dispatch:
    types: [release-published]

concurrency:
  group: deploy
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout site
        uses: actions/checkout@v6
        with:
          path: site

      - name: Checkout @noeta/theme
        uses: actions/checkout@v6
        with:
          repository: noeta-lang/noeta-theme
          path: noeta-theme

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        # Cuts ~30s off subsequent runs by reusing the chromium binary.
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('site/pnpm-lock.yaml') }}

      - name: Install Chromium
        # `playwright-core` is what's in the lockfile, so this uses the CLI
        # shipped with the locked version. --with-deps pulls the apt packages
        # chromium needs on ubuntu-latest; without it, launch() crashes.
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Resolve latest Noeta release tag
        # NOETA_VERSION is baked into the built HTML via SITE.version (the header's version pill).
        # A release-published dispatch carries the tag in its payload, so prefer that and skip the
        # API calls. For push / manual runs, try /releases/latest (excludes prereleases and drafts),
        # then fall back to the newest non-prerelease v-tag — a tag pushed without a GitHub release
        # still counts. GITHUB_TOKEN lifts the unauthenticated rate limit (60 → 5000 req/h).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          if [ -n "$PAYLOAD_TAG" ]; then
            TAG="$PAYLOAD_TAG"
            echo "Using tag from dispatch payload: $TAG"
          else
            TAG=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/noeta-lang/noeta/releases/latest \
              | jq -r '.tag_name // empty' || true)
            [ -n "$TAG" ] && echo "Using latest release tag from API: $TAG"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/noeta-lang/noeta/tags?per_page=100" \
              | jq -r '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
            [ -n "$TAG" ] && echo "Using latest non-prerelease tag: $TAG"
          fi
          if [ -n "$TAG" ]; then
            echo "NOETA_VERSION=$TAG" >> "$GITHUB_ENV"
          else
            echo "No release tag found; SITE.version stays null."
          fi

      - name: Build (site + OG image)
        run: pnpm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
